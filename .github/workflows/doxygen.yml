name: Publish release documentation

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the latest release is already deployed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doxygen-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check latest stable FastLED release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force || false }}
        run: bash scripts/check-release.sh

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out only the FastLED release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FastLED/FastLED
          ref: ${{ needs.check.outputs.tag }}
          path: fastled
          fetch-depth: 1
          persist-credentials: false
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - name: Build Doxygen documentation
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: bash scripts/build-docs.sh
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
